<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="JARVIS: a fully local voice assistant" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02050a"/>
      <stop offset="1" stop-color="#061827"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#f2feff"/>
      <stop offset=".4" stop-color="#7af4ff"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00e5ff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00e5ff" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="18"/></clipPath>
  </defs>
  <style>
    .r { transform-box: fill-box; transform-origin: center; }
    .cw { animation: spin 20s linear infinite; }
    .ccw { animation: spin 32s linear infinite reverse; }
    .fast { animation: spin 7s linear infinite; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    .blink { animation: blink 1.4s ease-in-out infinite; }
    .scan { animation: scan 7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: .8; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
    @keyframes scan { from { transform: translateY(-140px); } to { transform: translateY(400px); } }
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>

    <!-- HUD core -->
    <circle cx="260" cy="190" r="175" fill="url(#halo)"/>
    <g transform="translate(260 190)" fill="none">
      <circle class="r ccw" r="152" stroke="#00e5ff" stroke-opacity=".4" stroke-width="7" stroke-dasharray="1.5 6.46"/>
      <circle class="r cw" r="134" stroke="#00e5ff" stroke-width="3" stroke-dasharray="150 30 90 30 210 50 160 121.95" filter="url(#glow)"/>
      <circle class="r fast" r="120" stroke="#ffb340" stroke-width="2.5" stroke-dasharray="70 683.98" filter="url(#glow)"/>
      <circle r="104" stroke="#00e5ff" stroke-opacity=".45"/>
      <circle class="r ccw" r="92" stroke="#00e5ff" stroke-opacity=".7" stroke-dasharray="4 7"/>
      <circle class="r cw" r="72" stroke="#00e5ff" stroke-opacity=".35" stroke-width="12" stroke-dasharray="32 13.24"/>
      <circle r="54" stroke="#7af4ff" stroke-width="2"/>
      <circle class="r pulse" r="46" fill="url(#core)" stroke="none" filter="url(#glow)"/>
      <path d="M-175 0h-30M175 0h30M0 -175v-20M0 175v20" stroke="#00e5ff" stroke-opacity=".5"/>
    </g>

    <!-- connector -->
    <path d="M435 190h40l14-14h26" fill="none" stroke="#00e5ff" stroke-opacity=".6"/>
    <circle cx="515" cy="176" r="3" fill="#00e5ff"/>

    <!-- text -->
    <text x="540" y="116" fill="#7af4ff" fill-opacity=".75" font-size="15" letter-spacing="5">// LOCAL AI ASSISTANT · v0.1</text>
    <text x="534" y="206" fill="#eafcff" font-size="96" font-weight="700" letter-spacing="24" filter="url(#glow)">JARVIS</text>
    <text x="540" y="250" fill="#9db7c8" font-size="18" letter-spacing="1">Voice-first · 100% local · No cloud · No tokens</text>
    <rect x="540" y="272" width="560" height="1" fill="#00e5ff" fill-opacity=".25"/>
    <circle class="blink" cx="548" cy="303" r="5" fill="#3dffb0" filter="url(#glow)"/>
    <text x="564" y="308" fill="#3dffb0" font-size="14" letter-spacing="4">SYSTEMS ONLINE</text>
    <text x="772" y="308" fill="#5d7a8e" font-size="14" letter-spacing="2">▸ LLM  ▸ STT  ▸ TTS  ▸ HUD</text>

    <!-- frame corners -->
    <path d="M20 54V20h34M1146 20h34v34M1180 326v34h-34M54 360H20v-34" fill="none" stroke="#00e5ff" stroke-opacity=".55" stroke-width="2"/>
    <text x="1162" y="350" fill="#5d7a8e" font-size="11" letter-spacing="3" text-anchor="end">APPLE SILICON · OFFLINE CORE</text>

    <rect class="scan" width="1200" height="140" fill="url(#scan)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="379" rx="18" fill="none" stroke="#00e5ff" stroke-opacity=".25"/>
</svg>

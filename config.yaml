# Project defaults. Personal data (name, city, language) goes in .env:
#   cp .env.example .env
# Any key can be overridden with an env var, nesting with "__":
#   JARVIS_LLM__MODEL=qwen3.5:4b

assistant_name: Jarvis
language: pt-BR             # pt-BR, pt-PT, en-GB, en-US, es...
log_level: INFO
data_dir: data

# Set via JARVIS_OWNER_NAME / _GENDER / _TITLE
user:
  name: null
  gender: neutral           # female | male | neutral
  form_of_address: null     # null = language default

persona:
  style: null               # null = British butler
  max_sentences: 2

# Set via JARVIS_CITY; geocoded automatically with Open-Meteo
location:
  query: null

llm:
  host: http://localhost:11434
  model: qwen3:8b          # compare others with `python -m backend bench`
  keep_alive: 30m           # keep the model loaded to cut latency
  temperature: 0.6
  think: false              # thinking mode adds seconds of latency
  context_messages: 30      # tool calls and short results count too (~4 per tool turn)

stt:
  model: mlx-community/whisper-small-mlx   # more accurate, ~0.8 s slower: whisper-large-v3-turbo
  language: null            # null = assistant language

audio:
  input_device: null        # null = system default (see `python -m sounddevice`)
  output_device: null
  barge_in: false           # interrupt by speaking; needs headphones

vad:
  threshold: 0.5
  silence_ms: 700           # pause that ends an utterance

tts:
  engine: piper             # piper | say
  voice: null               # null = language default
  voices_dir: models/voices
  say_voice: null
  length_scale: null        # speaking speed: < 1 faster, > 1 slower

wakeword:
  enabled: true             # false = always listening (or `voice --no-wake`)
  model: hey_jarvis         # openWakeWord pre-trained model, or a path to a custom .onnx
  threshold: 0.5            # tune with `python -m backend wake-test`
  listen_timeout_s: 6       # after "Hey Jarvis", how long to wait for a request
  follow_up_s: 8            # after a reply, keep listening without the wake word
  chime: true               # short tones when waking up and going back to sleep

tools:
  enabled: [weather, news, system, timers]   # remove one to hide it from the model
  max_rounds: 3             # tool calls the model may chain before it must answer
  one_moment_after_s: 1.5   # say "one moment" when the model is silent this long

news:
  cache_minutes: 30
  max_items: 5
  feeds:
    - https://news.google.com/rss/search?q=intelig%C3%AAncia+artificial&hl=pt-BR&gl=BR&ceid=BR:pt-419
    - https://news.google.com/rss/search?q=artificial+intelligence&hl=en-US&gl=US&ceid=US:en
    - https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    - https://techcrunch.com/category/artificial-intelligence/feed/

briefing:
  enabled: true             # weather and AI news on start; `voice --no-briefing` skips it
  headlines: 6              # candidates the model picks the one or two most relevant from
  fetch_timeout_s: 5        # a source slower than this is left out

server:
  host: 127.0.0.1           # the HUD: http://127.0.0.1:8765
  port: 8765

hud:
  enabled: true             # holographic interface in the browser; `voice --no-hud` skips it
  open_browser: true        # open it on start, unless a HUD page is already open

[project]
name = "my-jarvis"
version = "0.1.0"
description = "A fully local voice assistant for macOS on Apple Silicon"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "piper-tts>=1.3",
    "pysilero-vad>=3.0",
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pydantic>=2.7",
    "pydantic-settings[yaml]>=2.3",
    "rich>=13.7",
    "openwakeword>=0.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.uv]
package = false
# macOS only (MLX, Metal). Also skips Linux-only wheels such as tflite-runtime.
environments = ["sys_platform == 'darwin'"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
